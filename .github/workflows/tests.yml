name: tests

on:
  push:
    branches: [main]
    paths-ignore: ['ops/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['ops/**', 'docs/**', '**/*.md']

# A newer push to the same PR cancels the older run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sim/requirements.lock
            sim/rl/requirements.txt

      - name: Install pinned Python dependencies
        run: python -m pip install numpy==1.26.4 PyYAML==6.0.2 -r sim/requirements.lock

      - name: Install pinned CPU PPO backend
        run: |
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r sim/rl/requirements.txt

      - name: Run test suites
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: bash tools/run_all_tests.sh

      - name: Discover simulation tests and run MuJoCo protocol
        run: |
          python .github/run_unittest.py sim/tests
          python -m sim.run_planar --config sim/configs/assumed_planar.json --out "$RUNNER_TEMP/wbr-planar-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
