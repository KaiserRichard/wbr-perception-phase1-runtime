name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Python dependencies
        run: python -m pip install numpy==1.26.4 PyYAML==6.0.2

      - name: Run test suites
        run: bash tools/run_all_tests.sh
