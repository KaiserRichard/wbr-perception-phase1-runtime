# Explicit sensor-compatible overrides for ros2 bag record/play.
/camera/camera/infra1/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
/camera/camera/infra2/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
/camera/camera/infra1/camera_info:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
/camera/camera/infra2/camera_info:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
/camera/camera/gyro/sample:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/camera/camera/accel/sample:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/tf_static:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 100
