<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140" viewBox="0 0 200 140">
  <!-- Simplified SN65HVD230 CAN transceiver breakout (own drawing, CC-BY-SA 3.0 with the WBR repo).
       Pins: 4-pin header 3V3/GND/CTX/CRX on the left edge, 2-way screw terminal CANH/CANL on the right. -->
  <rect x="2" y="2" width="196" height="136" rx="8" fill="#1f6fb2" stroke="#124a78" stroke-width="3"/>
  <circle cx="16" cy="16" r="5" fill="#fff" stroke="#124a78" stroke-width="2"/>
  <circle cx="16" cy="124" r="5" fill="#fff" stroke="#124a78" stroke-width="2"/>
  <rect x="74" y="44" width="40" height="34" rx="2" fill="#1d1d1f"/>
  <g fill="#b8b8b8"><rect x="78" y="38" width="4" height="6"/><rect x="88" y="38" width="4" height="6"/><rect x="98" y="38" width="4" height="6"/><rect x="108" y="38" width="4" height="6"/>
  <rect x="78" y="78" width="4" height="6"/><rect x="88" y="78" width="4" height="6"/><rect x="98" y="78" width="4" height="6"/><rect x="108" y="78" width="4" height="6"/></g>
  <text x="94" y="65" font-family="Arial,sans-serif" font-size="9" fill="#ddd" text-anchor="middle">VP230</text>
  <rect x="120" y="98" width="20" height="9" fill="#2b2b2b"/><text x="130" y="118" font-family="Arial,sans-serif" font-size="9" fill="#fff" text-anchor="middle">120R</text>
  <rect x="8" y="30" width="20" height="86" rx="2" fill="#1b1b1b"/>
  <g fill="#e8c46a" stroke="#6b5520" stroke-width="1.5">
    <rect id="pin_3V3" x="12" y="37" width="12" height="12" rx="2"/>
    <rect id="pin_GND" x="12" y="57" width="12" height="12" rx="2"/>
    <rect id="pin_CTX" x="12" y="77" width="12" height="12" rx="2"/>
    <rect id="pin_CRX" x="12" y="97" width="12" height="12" rx="2"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">
    <text x="33" y="47">3V3</text><text x="33" y="67">GND</text><text x="33" y="87">CTX</text><text x="33" y="107">CRX</text>
    <text x="158" y="37" text-anchor="end">CANH</text><text x="158" y="77" text-anchor="end">CANL</text>
  </g>
  <rect x="162" y="18" width="34" height="74" rx="3" fill="#2f9e5a" stroke="#1d6a3a" stroke-width="2"/>
  <circle id="pin_CANH" cx="179" cy="36" r="8" fill="#c9c9c9" stroke="#555" stroke-width="2"/>
  <circle id="pin_CANL" cx="179" cy="74" r="8" fill="#c9c9c9" stroke="#555" stroke-width="2"/>
  <line x1="174" y1="31" x2="184" y2="41" stroke="#555" stroke-width="2"/><line x1="174" y1="69" x2="184" y2="79" stroke="#555" stroke-width="2"/>
</svg>
