schema_version: 1
manifest_id: C1-T12-report-candidate-2026-10-30
status: BLOCKED_ASSEMBLY_PROVENANCE
scope: WBR simulation planning only; not an executable config or validated hardware model
evidence_labels:
  SOURCE-SUPPORTED: Stated in owner brief or cited local artifact; not necessarily measured
  INFERRED: Proposed mapping or procedure
  ASSUMED: Unvalidated numerical choice or physical property
provenance:
  evidence: SOURCE-SUPPORTED
  primary_report_file: null
  primary_report_page: null
  primary_report_revision: null
  local_transcriptions:
    - research/rl/BRIEF-R0.md:16
    - research/rl/PLAN.md:7
    - research/rl/REVIEW-2026-10-30.md:51
  limitation: Team-report PDF/page and assembly definitions were not supplied locally; no page citation invented
  blockers:
    - Recover report page and reconcile CAD/BOM membership with body/leg/wheel partition
    - Resolve whether leg and wheel masses are per side, per component, or combined assemblies
    - Resolve motor housing/rotor, battery, electronics, bearings and fastener ownership without double counting
  aggregation_rule: Never multiply report masses by two or divide among links until assembly scope is resolved
parameters:
  body_mass:
    value: 3.5
    unit: kg
    belongs_to: Report body assembly; rotating chassis lump in a reduced candidate
    report_assembly_scope: Body part membership unresolved; not established as total robot mass
    evidence: SOURCE-SUPPORTED
  leg_mass:
    value: 0.2
    unit: kg
    belongs_to: Report leg assembly; link-by-link and left/right allocation unresolved
    report_assembly_scope: UNKNOWN per side versus pair; not automatically four rods or two whole mechanisms
    evidence: SOURCE-SUPPORTED
  wheel_mass:
    value: 0.7
    unit: kg
    belongs_to: Report wheel assembly; tire/rotor/housing/axle membership unresolved
    report_assembly_scope: UNKNOWN per wheel versus pair
    evidence: SOURCE-SUPPORTED
  l1:
    value: 0.075
    unit: m
    belongs_to: Five-bar proximal link AB; repeated mechanism on each side only after geometry mapping
    evidence: SOURCE-SUPPORTED
  l4:
    value: 0.075
    unit: m
    belongs_to: Five-bar proximal link ED
    evidence: SOURCE-SUPPORTED
  l2:
    value: 0.14
    unit: m
    belongs_to: Five-bar distal link BC
    evidence: SOURCE-SUPPORTED
  l3:
    value: 0.14
    unit: m
    belongs_to: Five-bar distal link DC
    evidence: SOURCE-SUPPORTED
  l5:
    value: 0.08
    unit: m
    belongs_to: Chassis-fixed five-bar pivot spacing AE; not a fifth moving rod
    evidence: SOURCE-SUPPORTED
  wheel_radius:
    value: 0.0603
    unit: m
    belongs_to: Ideal rolling wheel radius in both sides' kinematics
    evidence: SOURCE-SUPPORTED
    limitation: Source constant; loaded effective rolling radius unmeasured
inertias:
  common_unit: kg m^2
  tensor_order: [Ixx, Iyy, Izz, Ixy, Ixz, Iyz]
  frame_rule: Body COM axes must be specified before use; rolling axis must be matched to model axis
  evidence: ASSUMED
  body_COM_pitch:
    value: 0.018
    unit: kg m^2
    belongs_to: Reduced body lump about its COM pitch axis
    evidence: ASSUMED
    origin: Legacy illustrative scalar; retained only as explicit candidate assumption, not mass-rescaled truth
  equivalent_leg_COM_pitch:
    value: 0.0012
    unit: kg m^2
    belongs_to: Combined equivalent rigid-leg lump about its COM pitch axis
    evidence: ASSUMED
    origin: Legacy illustrative scalar; not an identified five-bar inertia
  wheel_pair_rolling:
    value: 0.0011
    unit: kg m^2
    belongs_to: Combined wheel/axle rolling-axis lump; slider armature I/r^2 in reduced model
    evidence: ASSUMED
    origin: Legacy illustrative scalar; aggregation must be reconciled before new model generation
  body_tensor:
    value: null
    unit: kg m^2
    belongs_to: Report body assembly COM in declared body frame
    evidence: ASSUMED
  left_wheel_tensor:
    value: null
    unit: kg m^2
    belongs_to: Left wheel assembly COM
    evidence: ASSUMED
  right_wheel_tensor:
    value: null
    unit: kg m^2
    belongs_to: Right wheel assembly COM
    evidence: ASSUMED
  fivebar_link_tensors:
    value: null
    unit: kg m^2
    belongs_to: Each of l1,l2,l3,l4 on left and right mechanisms, about each link COM
    evidence: ASSUMED
    limitation: Requires individual masses, shapes, material and mounting; equal-rod allocation is unvalidated
  null_rule: Null means unknown, never zero; physical 3D model generation is blocked until explicit assumed tensors exist
candidate_reduction:
  evidence: ASSUMED
  not_active_in_sim: true
  mapping: Candidate body/combined-equivalent-leg/combined-wheel masses 3.5/0.2/0.7 only IF report assembly definitions support it
  fixed_axle_to_hip_length: {value: 0.16, unit: m, belongs_to: Equivalent rigid leg, evidence: ASSUMED}
  body_com: {value: 0.06, unit: m, belongs_to: Body COM above hip, evidence: ASSUMED}
  leg_com: {value: 0.08, unit: m, belongs_to: Equivalent leg COM above axle, evidence: ASSUMED}
  gravity: {value: 9.81, unit: m/s^2, belongs_to: World minus-z, evidence: ASSUMED}
  wheel_pair_cap: {value: 2.0, unit: N m, belongs_to: Combined virtual wheel input, evidence: ASSUMED}
  hip_pair_cap: {value: 4.0, unit: N m, belongs_to: Combined virtual hip input, evidence: ASSUMED}
  motor_lag: {value: 0.005, unit: s, belongs_to: Both aggregate actuator channels, evidence: ASSUMED}
  default_delay: {value: 0.002, unit: s, belongs_to: Sensor-to-actuation path, evidence: ASSUMED}
  timestep: {value: 0.002, unit: s, belongs_to: Plant and baseline tick, evidence: ASSUMED}
  warning: These are not DM motor specifications or physical capability; replace only through a versioned protocol
